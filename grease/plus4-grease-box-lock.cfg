# Plus4 Grease (--box-dry): the Box cool-down lock in front of QIDI's load commands.
# Written by Plus4 Grease; `bash ~/plus4-grease/install.sh uninstall` removes it.
#
# QIDI's Box templates (/home/mks/cfg_with_1 to cfg_with_4, copied to box.cfg when a Box is connected)
# include this file, so these commands are only renamed when QIDI's own exist. The include is a pattern
# that matches nothing if this file is gone, so Klipper still starts without it.
#
# Loading PLA or TPU from a Box that is still cooling after heating is refused, never waited for: see
# plus4-grease-box-dry.cfg. Every other load goes straight to QIDI's command, and so does
# every load when plus4-grease-box-dry.cfg isn't there.

[gcode_macro E_LOAD]
rename_existing: _GREASE_QIDI_E_LOAD
description: Load a Box slot to the toolhead (QIDI's E_LOAD, behind Plus4 Grease's cool-down lock)
gcode:
  {% if 'gcode_macro _GREASE_BOX_LOCKED' in printer %}
    _GREASE_BOX_LOCKED SLOT={params.SLOT|default(-1)}
  {% endif %}
  _GREASE_QIDI_E_LOAD {rawparams}

[gcode_macro E_BOX]
rename_existing: _GREASE_QIDI_E_BOX
description: Feed a Box slot (QIDI's E_BOX, behind Plus4 Grease's cool-down lock)
gcode:
  {% if 'gcode_macro _GREASE_BOX_LOCKED' in printer %}
    _GREASE_BOX_LOCKED SLOT={params.SLOT|default(-1)}
  {% endif %}
  _GREASE_QIDI_E_BOX {rawparams}

# QIDI's T0-T15 and its print start call EXTRUDER_LOAD SLOT=slotN. A print doesn't start while a Box
# holding PLA or TPU is locked, and such a Box can't be dried during a print, so this refuses only a Box
# heated by hand during a print.
[gcode_macro EXTRUDER_LOAD]
rename_existing: _GREASE_QIDI_EXTRUDER_LOAD
description: Load a Box slot to the extruder (QIDI's EXTRUDER_LOAD, behind Plus4 Grease's cool-down lock)
gcode:
  {% if 'gcode_macro _GREASE_BOX_LOCKED' in printer %}
    _GREASE_BOX_LOCKED SLOT={params.SLOT|default(-1)}
  {% endif %}
  _GREASE_QIDI_EXTRUDER_LOAD {rawparams}
