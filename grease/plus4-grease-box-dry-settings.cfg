# Plus4 Grease: your Box drying settings (install --box-dry). Yours to edit: Plus4 Grease's updates never
# change this file. After editing, save and restart Klipper (Fluidd's Save & Restart does both).
# GREASE_BOX_DRY_SETTINGS in the console shows the settings in use. Klipper reads these as Python values:
# keep True and False with their capital letters.
#
# Why QIDI won't heat a Box with PLA or TPU in it: the Box's feed tubes run along its floor, right beside
# the heaters. PLA or TPU sitting in those tubes softens while the Box is warm, and loading it before
# it hardens again can jam it in a tube. Plus4 Grease can dry PLA and TPU anyway, and then keeps that
# Box locked for loading PLA or TPU until it has cooled, and a print doesn't start until then (a print
# never waits for a Box). Drying PLA or TPU is never allowed during a print, or while that Box's filament
# is in the toolhead. A Box without PLA or TPU in it dries during a print as before.

[gcode_macro _GREASE_BOX_DRY_SETTINGS]
# Dry PLA and TPU in the Box: True or False.
variable_pla_drying: False
# Highest drying temperature for a Box holding PLA or TPU, 35 to 50 C.
variable_pla_max_temp: 45
# A Box holding PLA or TPU stays locked for loads until its air is at or below this, 30 to 45 C. Raise
# it if your room is warm enough that the Box can't get this cool.
variable_unlock_temp: 35
# ...and until this many minutes after its heater last ran, 10 to 120. The tubes beside the heaters
# cool more slowly than the air the Box's sensor reads.
variable_cool_minutes: 30
